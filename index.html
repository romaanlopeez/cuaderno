<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<meta name="description" content="Cuaderno técnico culinario: notas, proporciones y técnicas. Los datos se guardan solo en tu dispositivo.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Cuaderno técnico</title>
<style>
:root{
  --bg:#050505;--c1:#101010;--c2:#171717;--c3:#202020;--line:#2a2a2a;
  --y:#E6FF00;--ydim:rgba(230,255,0,.14);--ytxt:#050505;
  --tx:#ececec;--mut:#8b8b8b;--red:#ff5a4d;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45;touch-action:manipulation}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(92px + env(safe-area-inset-bottom));min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}
.muted{color:var(--mut)}
.mono{font-family:var(--mono)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center}

/* Hero */
.hero{padding:18px 0 14px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--y)}
.hero h1{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:8px 0 10px}
.hero h1 b{color:var(--y)}

/* Topbar */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0}
.back{width:40px;height:40px;border-radius:12px;background:var(--c2);border:1px solid var(--line);font-size:18px;flex:none}

/* Grid de categorías */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{position:relative;text-align:left;background:var(--c1);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:hidden}
.tile:active{background:var(--c3);border-color:var(--y)}
.tile .num{font-family:var(--mono);font-size:11px;color:var(--y);letter-spacing:.1em}
.tile .tname{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.2;word-break:break-word}
.tile .cnt{position:absolute;right:10px;top:9px;font-family:var(--mono);font-size:12px;color:var(--mut)}
.tile.has .cnt{color:var(--bg);background:var(--y);padding:0 7px;border-radius:99px;font-weight:700}

/* Cards */
.card{background:var(--c1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.note:active{border-color:var(--y)}
.path{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--y);text-transform:uppercase;margin-bottom:3px}
.note h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.snip{color:var(--mut);font-size:14px;margin-top:6px;white-space:pre-wrap}
.star{color:var(--y);font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--tx);background:var(--c2)}
button.tag{border-color:var(--y);color:var(--y)}
.empty{text-align:center;color:var(--mut);padding:34px 10px;border:1px dashed var(--line);border-radius:14px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--c2);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--y);color:var(--ytxt);border-color:var(--y);font-weight:700}
.chip.edit{border-style:dashed;color:var(--y);border-color:var(--y)}

/* Botones */
.btn{padding:12px 16px;border-radius:12px;font-weight:700;background:var(--c3);border:1px solid var(--line)}
.btn.pri{background:var(--y);color:var(--ytxt);border-color:var(--y)}
.btn.danger{color:var(--red);border-color:rgba(255,90,77,.4)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{display:block;width:100%;margin-top:10px;text-align:center}
.btn.ghost{background:transparent}
.btn:active{transform:scale(.98)}
.ghost.block{margin-top:6px}
.chipbtn{padding:9px 14px;border-radius:99px;border:1px solid var(--y);color:var(--y);font-size:14px;font-weight:600}

/* Inputs */
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--y);margin:16px 0 6px}
.inp{width:100%;background:var(--c1);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.inp:focus{border-color:var(--y);box-shadow:0 0 0 3px var(--ydim)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.45}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--y) 50%),linear-gradient(135deg,var(--y) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}
details{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:16px;background:var(--c1)}
summary{padding:12px 0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--y);cursor:pointer}
details label:first-of-type{margin-top:4px}

/* Vista nota */
.sec{margin:18px 0}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.ratio{font-family:var(--mono);font-size:19px;line-height:1.4;background:var(--ydim);border:1px solid rgba(230,255,0,.4);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.txt{white-space:pre-wrap;font-size:16px}
.sec ul,.sec ol{margin:0;padding-left:22px}
.sec li{margin:5px 0}
.sec li::marker{color:var(--y)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.actions .btn{padding:10px 4px;font-size:13px;text-align:center}
.meta{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:22px}

/* Gestión */
.item{display:flex;align-items:center;gap:8px;background:var(--c1);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:8px}
.item .nm{flex:1;min-width:0;font-weight:600;word-break:break-word}
.item .n{font-family:var(--mono);font-size:12px;color:var(--mut)}
.ib{width:36px;height:36px;border-radius:10px;background:var(--c3);border:1px solid var(--line);font-size:14px;flex:none}
.ib.del{color:var(--red)}
.addrow{display:flex;gap:8px;margin:10px 0 16px}
.addrow .inp{flex:1}
.banner{background:var(--ydim);border:1px solid rgba(230,255,0,.45);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}

/* Nav inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:1fr 1fr 74px 1fr;align-items:end;background:rgba(10,10,10,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 0;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--y)}
nav .plus{width:58px;height:58px;border-radius:50%;background:var(--y);color:var(--ytxt);font-size:30px;font-weight:300;margin:-26px auto 0;box-shadow:0 0 0 5px var(--bg),0 6px 22px rgba(230,255,0,.35);display:flex;align-items:center;justify-content:center;padding:0}
nav .plus:active{transform:scale(.94)}

/* Hojas / diálogos */
#sheet{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.72)}
#sheet.open{display:flex;align-items:flex-end}
#sheet .box{width:100%;max-height:94dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--c2);border-top:2px solid var(--y);border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
#sheet .box.full{height:94dvh}
.dlg h3{font-size:18px;margin-bottom:12px}
.dlg p{color:var(--mut);margin-bottom:6px}
.btns{display:flex;gap:8px;margin-top:16px}
.btns .btn{flex:1}
.edtop{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-18px;background:var(--c2);padding:6px 0 10px;margin-top:-6px;z-index:2}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--y);color:var(--ytxt);font-weight:700;padding:10px 16px;border-radius:99px;z-index:200;transition:.25s;font-size:14px;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button data-act="tab" data-tab="home"><i>▦</i>Índice</button>
  <button data-act="tab" data-tab="search"><i>⌕</i>Buscar</button>
  <button class="plus" data-act="new" aria-label="Nuevo apunte">+</button>
  <button data-act="tab" data-tab="settings"><i>⚙</i>Datos</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   CUADERNO TÉCNICO · app de un solo archivo
   Datos: localStorage (clave KEY). Exportar/Importar JSON.
   ========================================================= */
const KEY='cuaderno_tecnico_v1', BK='cuaderno_tecnico_ultima_copia';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const now=()=>new Date().toISOString();
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);

/* ---------- Datos iniciales (tus 24 categorías) ---------- */
function seed(){
  const base=[
    ['Humus / Variantes'],['Mantequillas'],['Risottos'],['Arroces secos / melosos'],
    ['Pastas rellenas, formas y salsas'],
    ['Emulsiones',['Calientes','Frías']],
    ['Salsas para carnes'],['Salsas para pescados'],['Carnes estofados'],['Pescados estofados'],
    ['Cremas'],['Chutneys / Mermeladas'],['Verduras'],
    ['Pizzas: masas, harinas y sabores',['Masas','Harinas','Sabores']],
    ['Crujientes: dulces / salados',['Dulces','Salados']],
    ['Espesantes: naturales y químicos',['Gomas y hidrocoloides','Almidones']],
    ['Potenciadores de sabor'],['Postres'],['Cremas dulces'],['Tartas'],['Patatas'],['Croquetas'],['Farsas'],['Aceites aromáticos']
  ];
  const categorias=base.map(([nombre,subs])=>({id:uid(),nombre,subs:(subs||[]).map(n=>({id:uid(),nombre:n}))}));
  const cat=n=>categorias.find(c=>c.nombre===n), sub=(c,n)=>c.subs.find(s=>s.nombre===n).id;
  const em=cat('Emulsiones'), es=cat('Espesantes: naturales y químicos'), ri=cat('Risottos'), ma=cat('Mantequillas');
  const mk=(o)=>Object.assign({id:uid(),titulo:'',cat:null,sub:null,ratio:'',clave:'',notas:'',variaciones:'',ingredientes:'',pasos:'',etiquetas:['ejemplo'],fav:false,creado:now(),editado:now()},o);
  const apuntes=[
    mk({titulo:'Mayonesa estable',cat:em.id,sub:sub(em,'Frías'),
      ratio:'1 yema : ~150–200 ml aceite\nSal 1 % · ácido al gusto (limón/vinagre)',
      clave:'Ingredientes a temperatura ambiente. Aceite en hilo al principio; cuando espese, ya se puede añadir más rápido. Si se corta: yema nueva y reincorporar la cortada poco a poco.',
      notas:'Ejemplo de apunte. Bórralo cuando quieras.',
      variaciones:'Alioli (ajo majado), mayonesa de ave asada, mayonesa de aceite aromático.',
      etiquetas:['ejemplo','base']}),
    mk({titulo:'Agar-agar',cat:es.id,sub:sub(es,'Gomas y hidrocoloides'),
      ratio:'0,5–1 % del peso del líquido',
      clave:'Hidratar y hervir 1–2 min para activarlo. Gelifica al enfriar (~35–40 °C). Gel firme y quebradizo; no es termorreversible a temperatura ambiente.',
      notas:'Ejemplo de apunte. Ajusta los % con tus propias pruebas.',
      variaciones:'Con más % → gel firme para cortar; con menos → textura de gelatina blanda.',
      etiquetas:['ejemplo','gel']}),
    mk({titulo:'Risotto base',cat:ri.id,
      ratio:'Arroz 70–80 g/persona\nCaldo ≈ 3× el peso del arroz',
      clave:'Nacarar el arroz. Caldo caliente, añadido poco a poco. Mantecar fuera del fuego con mantequilla fría y queso. Textura final: "all\'onda" (fluida).',
      ingredientes:'Arroz carnaroli o arborio\nCebolla o chalota\nVino blanco\nCaldo caliente\nMantequilla fría\nParmesano',
      pasos:'Sofreír la chalota sin color\nNacarar el arroz\nDesglasar con vino\nAñadir caldo por tandas\nMantecar fuera del fuego',
      etiquetas:['ejemplo','arroz']})
  ];
  return {categorias,apuntes};
}

/* ---------- Normalización / validación ---------- */
function normalize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.categorias)||!Array.isArray(d.apuntes))return null;
  const s=x=>typeof x==='string'?x:'';
  const C=d.categorias.filter(c=>c&&s(c.nombre).trim()).map(c=>({
    id:s(c.id)||uid(),nombre:s(c.nombre).trim(),
    subs:(Array.isArray(c.subs)?c.subs:[]).filter(x=>x&&s(x.nombre).trim()).map(x=>({id:s(x.id)||uid(),nombre:s(x.nombre).trim()}))
  }));
  const N=d.apuntes.filter(n=>n&&typeof n==='object').map(n=>({
    id:s(n.id)||uid(),titulo:s(n.titulo)||'Sin título',cat:s(n.cat)||null,sub:s(n.sub)||null,
    ratio:s(n.ratio),clave:s(n.clave),notas:s(n.notas),variaciones:s(n.variaciones),
    ingredientes:s(n.ingredientes),pasos:s(n.pasos),
    etiquetas:Array.isArray(n.etiquetas)?n.etiquetas.map(s).map(t=>t.trim()).filter(Boolean):[],
    fav:!!n.fav,creado:s(n.creado)||now(),editado:s(n.editado)||now()
  }));
  return {categorias:C,apuntes:N};
}
function fixRefs(st){
  const cs=new Set(st.categorias.map(c=>c.id));
  st.apuntes.forEach(n=>{
    if(n.cat&&!cs.has(n.cat)){n.cat=null;n.sub=null;}
    if(n.sub){const c=st.categorias.find(c=>c.id===n.cat);if(!c||!c.subs.some(s=>s.id===n.sub))n.sub=null;}
  });
  return st;
}

/* ---------- Estado ---------- */
let S;
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){
    try{const st=normalize(JSON.parse(raw));if(st)return fixRefs(st);}catch(e){}
    try{localStorage.setItem(KEY+'_corrupto',raw);}catch(e){}
  }
  return seed();
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('⚠ No se pudo guardar (almacenamiento bloqueado o lleno). Exporta JSON.');}
}
S=load();persist();

const ui={view:'home',catId:null,subId:'all',noteId:null,q:'',fCat:'all',fTag:null,fFav:false};
const stack=[];
let edId=null, dlgCb=null, dlgBack=null;

const catById=id=>S.categorias.find(c=>c.id===id)||null;
const subOf=n=>{const c=catById(n.cat);return c&&n.sub?(c.subs.find(s=>s.id===n.sub)||null):null;};
const noteById=id=>S.apuntes.find(n=>n.id===id);
const byDate=(a,b)=>(b.editado||'').localeCompare(a.editado||'');

/* ---------- Navegación ---------- */
function go(view,o){stack.push(Object.assign({},ui));Object.assign(ui,{view},o||{});render();window.scrollTo(0,0);}
function back(){const p=stack.pop();if(p)Object.assign(ui,p);else ui.view='home';render();}
function tab(v){stack.length=0;ui.view=v;if(v==='search'){ui.fFav=false;}render();window.scrollTo(0,0);}
const tabOf=v=>v==='search'?'search':v==='settings'?'settings':'home';

/* ---------- Utilidades UI ---------- */
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
function openSheet(html,full){const s=$('#sheet');s.innerHTML=`<div class="box${full?' full':''}">${html}</div>`;s.classList.add('open');}
function closeSheet(){const s=$('#sheet');s.classList.remove('open');s.innerHTML='';dlgCb=null;dlgBack=null;}
function ask(title,val,cb,back,okLabel){
  dlgBack=back||null;
  openSheet(`<div class="dlg"><h3>${esc(title)}</h3><input id="dlg-in" class="inp" value="${esc(val)}" autocomplete="off" autocapitalize="sentences"><div class="btns"><button class="btn" data-act="dlg-cancel">Cancelar</button><button class="btn pri" data-act="dlg-ok">${esc(okLabel||'Guardar')}</button></div></div>`);
  dlgCb=()=>{const v=($('#dlg-in').value||'').trim();if(!v)return;closeSheet();cb(v);};
  setTimeout(()=>{const i=$('#dlg-in');if(i){i.focus();i.select();}},60);
}
function confirmDlg(msg,okLabel,cb,back,danger){
  dlgBack=back||null;
  openSheet(`<div class="dlg"><h3>¿Seguro?</h3><p>${esc(msg)}</p><div class="btns"><button class="btn" data-act="dlg-cancel">Cancelar</button><button class="btn ${danger===false?'pri':'danger'}" data-act="dlg-ok">${esc(okLabel)}</button></div></div>`);
  dlgCb=()=>{closeSheet();cb();};
}

/* ---------- Tarjeta de apunte ---------- */
function noteCard(n){
  const c=catById(n.cat),s=subOf(n);
  const path=[c?c.nombre:'Sin categoría',s?s.nombre:null].filter(Boolean).join(' › ');
  const snip=(n.ratio||n.clave||n.notas||'').slice(0,140);
  return `<div class="card note" data-act="open" data-id="${n.id}">
    <div class="row"><div class="grow"><div class="path">${esc(path)}</div><h3>${esc(n.titulo)}</h3></div>${n.fav?'<span class="star">★</span>':''}</div>
    ${snip?`<p class="snip">${esc(snip)}</p>`:''}
    ${n.etiquetas.length?`<div class="tags">${n.etiquetas.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- Vistas ---------- */
function backupBanner(){
  let last=null;try{last=localStorage.getItem(BK);}catch(e){}
  const days=last?(Date.now()-new Date(last).getTime())/864e5:null;
  if(!S.apuntes.length)return '';
  if(days===null)return `<div class="banner">⚠ Aún no has hecho ninguna copia. Ve a <b>Datos → Exportar JSON</b>: Safari puede borrar los datos de webs que no abres en varios días.</div>`;
  if(days>7)return `<div class="banner">⚠ Tu última copia tiene ${Math.floor(days)} días. Conviene exportar otra (Datos → Exportar JSON).</div>`;
  return '';
}
function vHome(){
  const cnt={};S.apuntes.forEach(n=>{const k=n.cat&&catById(n.cat)?n.cat:'_';cnt[k]=(cnt[k]||0)+1;});
  const favs=S.apuntes.filter(n=>n.fav).length;
  let h=`<div class="hero"><div class="kicker">// BASE DE CONOCIMIENTO CULINARIO</div><h1>Cuaderno<br><b>técnico</b></h1><p class="muted mono" style="font-size:12px">${S.apuntes.length} apuntes · ${S.categorias.length} categorías</p></div>`;
  h+=backupBanner();
  if(favs)h+=`<button class="chipbtn" data-act="favs">★ Favoritos (${favs})</button>`;
  h+=`<div class="grid">`;
  S.categorias.forEach((k,i)=>{
    const n=cnt[k.id]||0;
    h+=`<button class="tile ${n?'has':''}" data-act="cat" data-id="${k.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="tname">${esc(k.nombre)}</span><span class="cnt">${n}</span></button>`;
  });
  if(cnt._)h+=`<button class="tile has" data-act="cat" data-id="_"><span class="num">--</span><span class="tname">Sin categoría</span><span class="cnt">${cnt._}</span></button>`;
  h+=`</div><button class="btn block" data-act="cats">Gestionar categorías</button>`;
  return h;
}
function vCat(){
  const virtual=ui.catId==='_';
  const k=virtual?{id:'_',nombre:'Sin categoría',subs:[]}:catById(ui.catId);
  if(!k){ui.view='home';return vHome();}
  let all=S.apuntes.filter(n=>virtual?!(n.cat&&catById(n.cat)):n.cat===k.id).sort(byDate);
  const noSub=all.filter(n=>!n.sub).length;
  let list=all;
  if(ui.subId==='none')list=all.filter(n=>!n.sub);
  else if(ui.subId!=='all')list=all.filter(n=>n.sub===ui.subId);
  if(ui.subId!=='all'&&ui.subId!=='none'&&!k.subs.some(s=>s.id===ui.subId)){ui.subId='all';list=all;}
  let h=`<div class="top"><button class="back" data-act="back">←</button><h2>${esc(k.nombre)}</h2></div>`;
  if(!virtual){
    h+=`<div class="chips"><button class="chip ${ui.subId==='all'?'on':''}" data-act="sub" data-id="all">Todo · ${all.length}</button>`;
    k.subs.forEach(s=>{h+=`<button class="chip ${ui.subId===s.id?'on':''}" data-act="sub" data-id="${s.id}">${esc(s.nombre)} · ${all.filter(n=>n.sub===s.id).length}</button>`;});
    if(k.subs.length&&noSub)h+=`<button class="chip ${ui.subId==='none'?'on':''}" data-act="sub" data-id="none">Sin sub. · ${noSub}</button>`;
    h+=`<button class="chip edit" data-act="subs" data-id="${k.id}">✎ Subcategorías</button></div>`;
  }
  h+=list.length?list.map(noteCard).join(''):`<div class="empty">Aún no hay apuntes aquí.<br>Pulsa <b style="color:var(--y)">+</b> para crear el primero.</div>`;
  return h;
}
function vNote(){

  h+=sec('Pasos',lines(n.pasos).length?`<ol>${lines(n.pasos).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'');

}
function vSearch(){
  const tags={};S.apuntes.forEach(n=>n.etiquetas.forEach(t=>tags[t]=(tags[t]||0)+1));
  const top=Object.keys(tags).sort((a,b)=>tags[b]-tags[a]||a.localeCompare(b)).slice(0,30);

function renderResults(){
  const words=norm(ui.q).split(/\s+/).filter(Boolean);
  let r=S.apuntes.filter(n=>{
    if(ui.fCat!=='all'&&n.cat!==ui.fCat)return false;
    if(ui.fFav&&!n.fav)return false;
    if(ui.fTag&&!n.etiquetas.includes(ui.fTag))return false;
    if(!words.length)return true;
    const c=catById(n.cat),s=subOf(n);
    const hay=norm([n.titulo,n.ratio,n.clave,n.notas,n.variaciones,n.ingredientes,n.pasos,n.etiquetas.join(' '),c?c.nombre:'',s?s.nombre:''].join(' '));
    return words.every(w=>hay.includes(w));
  }).sort(byDate);
  const el=$('#results');if(!el)return;
  el.innerHTML=`<p class="muted mono" style="font-size:11px;margin:4px 0 10px">${r.length} RESULTADO${r.length===1?'':'S'}</p>`+(r.length?r.map(noteCard).join(''):'<div class="empty">Nada encontrado.</div>');
}

/* ---------- Editor de apuntes ---------- */
const catOptions=sel=>`<option value="">— Sin categoría —</option>`+S.categorias.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nombre)}</option>`).join('');

function openEditor(id,pre){
  const n=id?noteById(id):null;

    <label>Pasos · uno por línea</label><textarea id="f-pasos" class="inp" rows="5" style="margin-bottom:12px">${esc(v.pasos)}</textarea>

function saveNote(){
  const g=i=>($('#'+i).value||'');
  const titulo=g('f-titulo').trim();
  if(!titulo){toast('Pon un título');$('#f-titulo').focus();return;}
  const data={titulo,cat:g('f-cat')||null,sub:g('f-sub')||null,ratio:g('f-ratio').trim(),clave:g('f-clave').trim(),notas:g('f-notas').trim(),variaciones:g('f-vars').trim(),ingredientes:g('f-ing').trim(),pasos:g('f-pasos').trim(),
    etiquetas:[...new Set(g('f-tags').split(',').map(t=>t.trim()).filter(Boolean))]};
  let n=edId?noteById(edId):null;
  if(n)Object.assign(n,data,{editado:now()});
  else{n=Object.assign({id:uid(),fav:false,creado:now(),editado:now()},data);S.apuntes.push(n);}
  persist();closeSheet();
  ui.noteId=n.id;
  if(ui.view!=='note'){stack.push(Object.assign({},ui));ui.view='note';}
  render();window.scrollTo(0,0);toast('Guardado');
}

/* ---------- Exportar / Importar ---------- */
const payload=()=>JSON.stringify({app:'cuaderno-tecnico',version:1,exportado:now(),categorias:S.categorias,apuntes:S.apuntes},null,2);
const fname=()=>'cuaderno-tecnico-'+new Date().toISOString().slice(0,10)+'.json';
function markBackup(){try{localStorage.setItem(BK,now());}catch(e){}}
function exportJSON(){
  const blob=new Blob([payload()],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname();
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  markBackup();toast('Exportado ✔');if(ui.view==='settings')render();
}
async function shareJSON(){
  try{
    const f=new File([payload()],fname(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:'Cuaderno técnico'});
      markBackup();if(ui.view==='settings')render();return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  exportJSON();
}
function allSubIds(){const s=new Set();S.categorias.forEach(c=>c.subs.forEach(x=>s.add(x.id)));return s;}
function mergeIn(inc){
  const cmap={},smap={};let nc=0,nn=0,un=0;
  inc.categorias.forEach(ic=>{
    let c=S.categorias.find(x=>norm(x.nombre)===norm(ic.nombre));
    if(!c){c={id:S.categorias.some(x=>x.id===ic.id)?uid():ic.id,nombre:ic.nombre,subs:[]};S.categorias.push(c);nc++;}
    cmap[ic.id]=c.id;
    ic.subs.forEach(is=>{
      let s=c.subs.find(x=>norm(x.nombre)===norm(is.nombre));
      if(!s){s={id:allSubIds().has(is.id)?uid():is.id,nombre:is.nombre};c.subs.push(s);}
      smap[is.id]=s.id;
    });
  });
  inc.apuntes.forEach(n=>{
    const m=Object.assign({},n,{cat:cmap[n.cat]||null,sub:smap[n.sub]||null});
    const ex=noteById(n.id);
    if(!ex){S.apuntes.push(m);nn++;}
    else if((m.editado||'')>(ex.editado||'')){Object.assign(ex,m);un++;}
  });
  return {nc,nn,un};
}
function handleFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    let inc=null;
    try{inc=normalize(JSON.parse(r.result));}catch(e){}
    if(!inc){toast('Archivo no válido');return;}
    fixRefs(inc);
    window.__inc=inc;
    openSheet(`<div class="dlg"><h3>Importar archivo</h3>
      <p>Contiene <b style="color:var(--y)">${inc.apuntes.length}</b> apuntes y <b style="color:var(--y)">${inc.categorias.length}</b> categorías.</p>
      <p><b>Combinar</b> añade lo nuevo y conserva lo tuyo (categorías con el mismo nombre se fusionan).<br><b>Reemplazar</b> sustituye todo lo actual.</p>
      <button class="btn pri block" data-act="imp-merge">Combinar con lo que tengo</button>
      <button class="btn danger block" data-act="imp-replace">Reemplazar todo</button>
      <button class="btn block" data-act="close">Cancelar</button></div>`);
  };
  r.onerror=()=>toast('No se pudo leer el archivo');
  r.readAsText(file);
}

/* ---------- Acciones ---------- */
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;const t=arr[i];arr[i]=arr[j];arr[j]=t;}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='sheet'){closeSheet();}return;}
  const d=t.dataset,a=d.act;
  switch(a){
    case 'tab':tab(d.tab);break;
    case 'back':back();break;
    case 'cat':go('cat',{catId:d.id,subId:'all'});break;
    case 'sub':ui.subId=d.id;render();break;
    case 'open':go('note',{noteId:d.id});break;
    case 'favs':go('search',{fFav:true,q:'',fCat:'all',fTag:null});break;
    case 'cats':go('cats');break;
    case 'new':{
      const pre={};
      if(ui.view==='cat'&&ui.catId&&ui.catId!=='_'){pre.cat=ui.catId;if(ui.subId!=='all'&&ui.subId!=='none')pre.sub=ui.subId;}
      openEditor(null,pre);break;}
    case 'edit':openEditor(d.id);break;
    case 'save-note':saveNote();break;
    case 'close':closeSheet();break;
    case 'dlg-ok':if(dlgCb)dlgCb();break;
    case 'dlg-cancel':{const b=dlgBack;closeSheet();if(b)b();break;}
    case 'fav':{const n=noteById(d.id);n.fav=!n.fav;n.editado=now();persist();render();break;}
    case 'dup':{const n=noteById(d.id);const c=Object.assign({},n,{id:uid(),titulo:n.titulo+' (copia)',etiquetas:n.etiquetas.slice(),fav:false,creado:now(),editado:now()});S.apuntes.push(c);persist();ui.noteId=c.id;render();window.scrollTo(0,0);toast('Duplicado');break;}
    case 'del-note':confirmDlg('Se borrará este apunte de forma permanente.','Borrar',()=>{S.apuntes=S.apuntes.filter(n=>n.id!==d.id);persist();back();toast('Apunte borrado');});break;
    case 'tag':go('search',{fTag:d.t,q:'',fCat:'all',fFav:false});break;
    case 'ffav':ui.fFav=!ui.fFav;render();break;
    case 'ftag':ui.fTag=d.t||null;render();break;
    /* categorías */
    case 'cat-add':{const i=$('#newcat');const v=(i.value||'').trim();if(!v)break;if(S.categorias.some(c=>norm(c.nombre)===norm(v))){toast('Ya existe esa categoría');break;}S.categorias.push({id:uid(),nombre:v,subs:[]});persist();render();break;}
    case 'cat-ren':{const c=catById(d.id);ask('Renombrar categoría',c.nombre,v=>{c.nombre=v;persist();render();});break;}
    case 'cat-del':{const c=catById(d.id);const n=S.apuntes.filter(x=>x.cat===c.id).length;
      confirmDlg(`Eliminar «${c.nombre}» y sus ${c.subs.length} subcategorías. Sus ${n} apuntes NO se borran: pasan a «Sin categoría».`,'Eliminar',()=>{
        S.apuntes.forEach(x=>{if(x.cat===c.id){x.cat=null;x.sub=null;}});
        S.categorias=S.categorias.filter(x=>x.id!==c.id);persist();render();toast('Categoría eliminada');});break;}
    case 'cat-up':case 'cat-down':{const i=S.categorias.findIndex(c=>c.id===d.id);move(S.categorias,i,a==='cat-up'?-1:1);persist();render();break;}
    /* subcategorías */
    case 'subs':case 'subs-m':openSubs(d.id);break;
    case 'sub-add':{const c=catById(d.id);const v=($('#newsub').value||'').trim();if(!v)break;if(c.subs.some(s=>norm(s.nombre)===norm(v))){toast('Ya existe');break;}c.subs.push({id:uid(),nombre:v});persist();openSubs(c.id);render();break;}
    case 'sub-ren':{const c=catById(d.id),s=c.subs.find(x=>x.id===d.s);ask('Renombrar subcategoría',s.nombre,v=>{s.nombre=v;persist();openSubs(c.id);render();},()=>openSubs(c.id));break;}
    case 'sub-del':{const c=catById(d.id),s=c.subs.find(x=>x.id===d.s);const n=S.apuntes.filter(x=>x.sub===s.id).length;
      confirmDlg(`Eliminar «${s.nombre}». Sus ${n} apuntes se conservan en «${c.nombre}» sin subcategoría.`,'Eliminar',()=>{
        S.apuntes.forEach(x=>{if(x.sub===s.id)x.sub=null;});c.subs=c.subs.filter(x=>x.id!==s.id);
        if(ui.subId===s.id)ui.subId='all';persist();openSubs(c.id);render();},()=>openSubs(c.id));break;}
    case 'sub-up':{const c=catById(d.id);const i=c.subs.findIndex(x=>x.id===d.s);move(c.subs,i,-1);persist();openSubs(c.id);render();break;}
    /* datos */
    case 'export':exportJSON();break;
    case 'share':shareJSON();break;
    case 'import':{const f=$('#file');if(f){f.value='';f.click();}break;}
    case 'imp-merge':{const r=mergeIn(window.__inc);persist();closeSheet();render();toast(`Combinado: +${r.nn} apuntes, ${r.un} actualizados, +${r.nc} categorías`);break;}
    case 'imp-replace':{S=fixRefs(window.__inc);persist();closeSheet();stack.length=0;ui.view='home';render();toast('Datos reemplazados');break;}
    case 'reset':confirmDlg('Se borrarán TODOS tus apuntes y categorías actuales. Exporta antes un JSON si quieres conservarlos.','Restablecer',()=>{S=seed();persist();stack.length=0;ui.view='home';render();toast('Restablecido');});break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;renderResults();}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='fcat'){ui.fCat=e.target.value;renderResults();}
  else if(id==='f-cat'){$('#f-sub').innerHTML=subOptions(e.target.value,'');}
  else if(id==='file'){handleFile(e.target.files&&e.target.files[0]);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(e.target.id==='dlg-in'&&dlgCb)dlgCb();
    else if(e.target.id==='newcat')document.querySelector('[data-act="cat-add"]').click();
    else if(e.target.id==='newsub')document.querySelector('[data-act="sub-add"]').click();
  }
});
render();
</script>
<script>
/* Registro del service worker (solo en http/https, no con file://) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
